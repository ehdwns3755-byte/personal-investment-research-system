name: Daily Investment Data Update

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 UTC 00:00 = KST 09:00
  workflow_dispatch:        # 수동 실행 가능 (GitHub Actions 탭에서 "Run workflow")

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Fetch prices & Claude analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit & push data.json
        run: |
          git config user.name  "Investment Bot"
          git config user.email "bot@noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: daily update $(date +'%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git push
